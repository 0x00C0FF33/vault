[package]
name = "vault"
version = "1.0.0"
edition = "2024"
# Duration::from_mins (app/config.rs) stabilised in 1.91.
rust-version = "1.91"
authors = ["Kimlong"]
description = "A local-first encrypted credential manager with vim-style TUI"
license = "GPL-3.0-only"
repository = "https://github.com/iamKimlong/vault"
keywords = ["password", "credential", "manager", "tui", "encryption"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Database
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# Crypto
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
rand = "0.8"
libc = "0.2"
secrecy = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

# TOTP
totp-rs = { version = "5.6", features = ["otpauth"] }
# otpauth:// URIs are parsed here rather than by totp-rs; see totp.rs::from_uri
url = "2.5"
percent-encoding = "2.3"

# Clipboard
arboard = "3.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
hex = "0.4"
base64 = "0.22"
dirs = "5.0"
thiserror = "1.0"
anyhow = "1.0"
subtle = "2.6"
age = { version = "0.12.1", default-features = false, features = ["armor"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3.12"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

[profile.release]
opt-level = 3
lto = true
strip = true
